name: Build ReturnYTCast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ReturnYTCast
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build ReturnYTCast
        id: build
        run: |
          make clean
          make package FINALPACKAGE=1

          PACKAGE_VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Built ReturnYTCast v$PACKAGE_VERSION"

      - name: Prepare Release Files
        run: |
          mkdir -p release

          DYLIB=$(find .theos -name "ReturnYTCast.dylib" -type f ! -path "*.dSYM/*" | head -1)

          if [ -z "$DYLIB" ]; then
            echo "ReturnYTCast.dylib not found"
            exit 1
          fi

          echo "Found dylib: $DYLIB"

          cp "$DYLIB" release/ReturnYTCast.dylib
          cp ReturnYTCast.plist release/ReturnYTCast.plist

          ls -lah release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReturnYTCast
          path: |
            release/ReturnYTCast.dylib
            release/ReturnYTCast.plist

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.build.outputs.PACKAGE_VERSION }}
          name: ReturnYTCast v${{ steps.build.outputs.PACKAGE_VERSION }}
          files: |
            release/ReturnYTCast.dylib
            release/ReturnYTCast.plist
          generate_release_notes: true
